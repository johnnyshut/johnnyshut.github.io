<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    
    <!-- Preload critical resources -->
    <link rel="preload" href="{{ '/assets/css/main.css' | relative_url }}" as="style">
    <link rel="preload" href="{{ '/assets/images/avatar.jpg' | relative_url }}" as="image">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
    <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/favicon.svg' | relative_url }}">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SEO and Social -->
    {% seo %}
    
    <!-- Additional Meta Tags -->
    <meta name="robots" content="index, follow">
    <meta name="author" content="{{ site.author.name }}">
    <meta name="keywords" content="Full Stack Developer, DevOps Engineer, Node.js, React, Python, PHP, 1С, веб-разработка, автоматизация">
    <meta name="language" content="ru">
    <meta name="revisit-after" content="7 days">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:image" content="{{ site.url }}/assets/images/avatar.jpg">
    <meta property="og:locale" content="ru_RU">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ site.url }}{{ page.url }}">
    <meta property="twitter:title" content="{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}">
    <meta property="twitter:description" content="{{ site.description }}">
    <meta property="twitter:image" content="{{ site.url }}/assets/images/avatar.jpg">
    
    <!-- Additional Performance -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "{{ site.author.name }}",
        "jobTitle": "Full Stack Developer",
        "email": "{{ site.author.email }}",
        "url": "{{ site.url }}",
        "sameAs": [
            "https://github.com/{{ site.author.github }}",
            "https://t.me/{{ site.author.telegram }}"
        ]
    }
    </script>
</head>

    <!-- JavaScript for mobile menu and animations -->
    <!-- PDF Generation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Contact Form Handler -->
    <script src="{{ '/js/contact-form.js' | relative_url }}"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Mobile menu toggle
            const navToggle = document.querySelector('.nav-toggle');
            const navMenu = document.querySelector('.nav-menu');
            
            if (navToggle && navMenu) {
                navToggle.addEventListener('click', function() {
                    const isExpanded = navToggle.getAttribute('aria-expanded') === 'true';
                    navToggle.setAttribute('aria-expanded', !isExpanded);
                    navMenu.classList.toggle('nav-menu--open');
                });
            }

            // Scroll animations
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('animated');
                    }
                });
            }, observerOptions);

            // Observe all elements with animation classes
            const animatedElements = document.querySelectorAll('.animate-on-scroll, .animate-slide-left, .animate-slide-right, .animate-scale');
            animatedElements.forEach(el => observer.observe(el));

            // Smooth scrolling for navigation links
            const navLinks = document.querySelectorAll('.nav-link[href^="#"]');
            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('href');
                    const targetElement = document.querySelector(targetId);
                    
                    if (targetElement) {
                        const headerHeight = document.querySelector('.header').offsetHeight;
                        const targetPosition = targetElement.offsetTop - headerHeight - 20;
                        
                        window.scrollTo({
                            top: targetPosition,
                            behavior: 'smooth'
                        });

                        // Close mobile menu if open
                        if (navMenu.classList.contains('nav-menu--open')) {
                            navToggle.setAttribute('aria-expanded', 'false');
                            navMenu.classList.remove('nav-menu--open');
                        }
                    }
                });
            });

            // Add loading animation to hero CTA
            const heroCta = document.querySelector('.hero-cta');
            if (heroCta) {
                heroCta.addEventListener('click', function(e) {
                    if (this.getAttribute('href') === '#contacts') {
                        e.preventDefault();
                        const contactsSection = document.querySelector('#contacts');
                        if (contactsSection) {
                            const headerHeight = document.querySelector('.header').offsetHeight;
                            const targetPosition = contactsSection.offsetTop - headerHeight - 20;
                            
                            window.scrollTo({
                                top: targetPosition,
                                behavior: 'smooth'
                            });
                        }
                    }
                });
            }

            // Contact form handling
            const contactForm = document.getElementById('contactForm');
            if (contactForm) {
                contactForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const submitBtn = this.querySelector('.form-submit');
                    const submitText = submitBtn.querySelector('.submit-text');
                    const submitLoading = submitBtn.querySelector('.submit-loading');
                    const formSuccess = document.getElementById('formSuccess');
                    const formError = document.getElementById('formError');
                    
                    // Show loading state
                    submitBtn.disabled = true;
                    submitText.style.display = 'none';
                    submitLoading.style.display = 'flex';
                    
                    // Get form data
                    const formData = new FormData(this);
                    const name = formData.get('name');
                    const email = formData.get('email');
                    const subject = formData.get('subject') || 'Сообщение с сайта';
                    const message = formData.get('message');
                    
                    // Create GitHub issue
                    createGitHubIssue(name, email, subject, message)
                        .then(() => {
                            // Reset button state
                            submitBtn.disabled = false;
                            submitText.style.display = 'block';
                            submitLoading.style.display = 'none';
                            
                            // Show success message
                            formSuccess.style.display = 'flex';
                            formError.style.display = 'none';
                            
                            // Reset form
                            this.reset();
                            
                            // Hide success message after 5 seconds
                            setTimeout(() => {
                                formSuccess.style.display = 'none';
                            }, 5000);
                        })
                        .catch((error) => {
                            console.error('Error creating issue:', error);
                            
                            // Reset button state
                            submitBtn.disabled = false;
                            submitText.style.display = 'block';
                            submitLoading.style.display = 'none';
                            
                            // Update error message with specific details
                            const errorMessage = document.querySelector('#formError p');
                            if (errorMessage) {
                                if (error.message.includes('authentication')) {
                                    errorMessage.textContent = 'GitHub API требует аутентификации. Включите Issues в настройках репозитория и убедитесь, что репозиторий публичный.';
                                } else if (error.message.includes('Issues are disabled')) {
                                    errorMessage.textContent = 'Issues отключены для этого репозитория. Включите их в настройках GitHub.';
                                } else if (error.message.includes('Repository not found')) {
                                    errorMessage.textContent = 'Репозиторий не найден или недоступен. Проверьте настройки репозитория.';
                                } else {
                                    errorMessage.textContent = `Ошибка: ${error.message}. Свяжитесь со мной напрямую через контакты выше.`;
                                }
                            }
                            
                            // Show error message
                            formError.style.display = 'flex';
                            formSuccess.style.display = 'none';
                            
                            // Hide error message after 8 seconds (longer for more detailed message)
                            setTimeout(() => {
                                formError.style.display = 'none';
                            }, 8000);
                        });
                });
            }

            // Theme toggle functionality
            const themeToggle = document.querySelector('.theme-toggle');
            const html = document.documentElement;
            
            // Check for saved theme preference or default to 'light'
            const currentTheme = localStorage.getItem('theme') || 'light';
            html.dataset.theme = currentTheme;
            
            if (themeToggle) {
                themeToggle.addEventListener('click', function() {
                    const currentTheme = html.dataset.theme;
                    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                    
                    html.dataset.theme = newTheme;
                    localStorage.setItem('theme', newTheme);
                });
            }
        });


        // PDF Generation Function using HTML to Canvas
        let isGeneratingPDF = false;
        async function generateResumePDF() {
            if (isGeneratingPDF) return;
            isGeneratingPDF = true;
            // Create a temporary div with resume content
            const resumeDiv = document.createElement('div');
            resumeDiv.style.cssText = `
                position: fixed;
                top: -9999px;
                left: -9999px;
                width: 210mm;
                background: white;
                padding: 20mm;
                font-family: 'Inter', Arial, sans-serif;
                font-size: 12px;
                line-height: 1.4;
                color: #333;
            `;
            
            resumeDiv.innerHTML = `
                <div style="background: #1a1a1a; color: white; padding: 20px; margin: -20px -20px 20px -20px;">
                    <h1 style="margin: 0; font-size: 24px; font-weight: bold;">Карло Иван</h1>
                    <p style="margin: 5px 0 0 0; font-size: 14px;">Full Stack Developer / DevOps Engineer</p>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h2 style="color: #1a1a1a; font-size: 14px; margin: 0 0 10px 0; text-transform: uppercase;">КОНТАКТНАЯ ИНФОРМАЦИЯ</h2>
                    <p style="margin: 5px 0;"><strong>Email:</strong> i.karlo@outlook.com</p>
                    <p style="margin: 5px 0;"><strong>Телефон:</strong> +7 (926) 156-89-03</p>
                    <p style="margin: 5px 0;"><strong>GitHub:</strong> github.com/johnnyshut</p>
                    <p style="margin: 5px 0;"><strong>Telegram:</strong> @ivcarlo</p>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h2 style="color: #1a1a1a; font-size: 14px; margin: 0 0 10px 0; text-transform: uppercase;">О СЕБЕ</h2>
                    <p style="margin: 0;">Опытный Full Stack разработчик с 5+ годами опыта в создании веб-приложений и автоматизации процессов. Специализируюсь на Node.js, React, Python, PHP и 1С:Предприятие. Имею опыт работы с облачными технологиями и DevOps практиками.</p>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h2 style="color: #1a1a1a; font-size: 14px; margin: 0 0 10px 0; text-transform: uppercase;">ТЕХНИЧЕСКИЕ НАВЫКИ</h2>
                    <ul style="margin: 0; padding-left: 20px;">
                        <li><strong>Backend:</strong> Node.js, Python, PHP, Express.js, FastAPI, Laravel</li>
                        <li><strong>Frontend:</strong> React, Vue.js, TypeScript, JavaScript, HTML5, CSS3</li>
                        <li><strong>Databases:</strong> PostgreSQL, MySQL, MongoDB, Redis, Elasticsearch</li>
                        <li><strong>DevOps:</strong> Docker, Kubernetes, AWS, Google Cloud, Azure, CI/CD</li>
                        <li><strong>Tools:</strong> Git, Linux, Nginx, Apache, Jest, Cypress, Figma, 1С:Предприятие</li>
                    </ul>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h2 style="color: #1a1a1a; font-size: 14px; margin: 0 0 10px 0; text-transform: uppercase;">ОПЫТ РАБОТЫ</h2>
                    
                    <div style="margin-bottom: 15px;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h3 style="margin: 0; font-size: 14px; font-weight: bold;">Senior Full Stack Developer</h3>
                            <span style="font-size: 12px; color: #666;">2022 - настоящее время</span>
                        </div>
                        <p style="margin: 5px 0; font-size: 12px; color: #666;">IT Solutions Company</p>
                        <p style="margin: 5px 0 0 0;">Разработка и поддержка веб-приложений на Node.js и React. Внедрение DevOps практик, настройка CI/CD пайплайнов. Работа с микросервисной архитектурой и облачными технологиями.</p>
                    </div>
                    
                    <div style="margin-bottom: 15px;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h3 style="margin: 0; font-size: 14px; font-weight: bold;">Full Stack Developer</h3>
                            <span style="font-size: 12px; color: #666;">2020 - 2022</span>
                        </div>
                        <p style="margin: 5px 0; font-size: 12px; color: #666;">Web Development Agency</p>
                        <p style="margin: 5px 0 0 0;">Разработка клиентских проектов на PHP и JavaScript. Интеграция с внешними API, работа с базами данных. Создание адаптивных интерфейсов и оптимизация производительности.</p>
                    </div>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h2 style="color: #1a1a1a; font-size: 14px; margin: 0 0 10px 0; text-transform: uppercase;">ОБРАЗОВАНИЕ</h2>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h3 style="margin: 0; font-size: 14px; font-weight: bold;">Бакалавр информационных технологий</h3>
                            <p style="margin: 5px 0; font-size: 12px; color: #666;">Московский технический университет</p>
                        </div>
                        <span style="font-size: 12px; color: #666;">2016 - 2020</span>
                    </div>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h2 style="color: #1a1a1a; font-size: 14px; margin: 0 0 10px 0; text-transform: uppercase;">СЕРТИФИКАТЫ</h2>
                    <ul style="margin: 0; padding-left: 20px;">
                        <li>AWS Certified Solutions Architect (2023)</li>
                        <li>Google Cloud Professional Developer (2022)</li>
                        <li>Docker Certified Associate (2021)</li>
                        <li>1С:Специалист по платформе 8.3 (2020)</li>
                    </ul>
                </div>
                
                <div style="background: #f8f9fa; padding: 10px; margin: 20px -20px -20px -20px; text-align: center; font-size: 10px; color: #666;">
                    Резюме сгенерировано автоматически с сайта
                </div>
            `;
            
            document.body.appendChild(resumeDiv);
            
            try {
                // Convert HTML to canvas
                const canvas = await html2canvas(resumeDiv, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true
                });
                
                // Create PDF from canvas
                const { jsPDF } = globalThis.jspdf;
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF('p', 'mm', 'a4');
                
                const imgWidth = 210;
                const pageHeight = 295;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                let heightLeft = imgHeight;
                
                let position = 0;
                
                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;
                
                while (heightLeft >= 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                }
                
                pdf.save('Карло_Иван_Resume.pdf');
                
            } catch (error) {
                console.error('Error generating PDF:', error);
                alert('Ошибка при генерации PDF. Попробуйте еще раз.');
            } finally {
                resumeDiv.remove();
                isGeneratingPDF = false;
            }
        }
        
    </script>
</body>
</html>
